name: Core21 production grouping candidate and legacy compatibility
on:
  push:
    branches: [qualification/core21-grouped]
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # GitHub restricts downloading a draft release asset to content writers.
    # The token is exposed only to the bounded fixture-download step below.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build libgmp-dev libsqlite3-dev libboost-dev libevent-dev pkg-config
      - name: Retrieve bounded public block fixture
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/wizz13150/prime-gap-network/releases/assets/751563538 -H 'Accept: application/octet-stream' > public-history249.blocks
          echo '09f318bfa826fad3d2af199ead9bb321dad039308864e549e3b92e6db6cfb7e4  public-history249.blocks' | sha256sum -c -
      - name: Build actual Core and settlement guards from the same ABI
        run: |
          cmake -S wallet/riecoin-core-upstream-v2606 -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DBUILD_DAEMON=ON -DENABLE_IPC=OFF -DWITH_ZMQ=OFF -DWITH_USDT=OFF -DPGN_DAEMON_OUTPUT_NAME=pgn-core
          cmake --build build-native --parallel 2 --target riecoind pgn-native-audit-settlement-test
      - name: Actual ConnectBlock, relay, watch wallet, cold restart and reorg
        run: |
          set -euo pipefail
          mkdir -p evidence21
          build-native/bin/pgn-native-audit-settlement-test "$PWD/build-native/guard249" | tee evidence21/native-guards.jsonl
          python3 tests/native_grouped249_actual.py --core build-native/bin/pgn-core --history public-history249.blocks --legacy --receipt evidence21/actual.json
      - name: Collect exact production Core
        run: |
          mkdir -p core21
          cp build-native/bin/pgn-core core21/pgn-core
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          p=Path('core21/pgn-core')
          Path('evidence21/CORE-BUILD.json').write_text(json.dumps(dict(source=os.environ['GITHUB_SHA'],version='2026.11.15.21',activation=4096,files=[dict(path=p.name,bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest())]),indent=2)+'\n')
          PY
      - name: Preserve production candidate and test receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: core21-ubuntu-${{ github.run_id }}
          path: |
            core21
            evidence21
          if-no-files-found: error
          retention-days: 7
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disposable runner paths and interpreter
        shell: pwsh
        run: |
          git config --global core.longpaths true
          $qualPython = (Get-Command python).Source.Replace('\','/')
          "QUAL_PYTHON=$qualPython" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact public fixture only
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/wizz13150/prime-gap-network/releases/assets/751563538 -H 'Accept: application/octet-stream' > public-history249.blocks
          echo '09f318bfa826fad3d2af199ead9bb321dad039308864e549e3b92e6db6cfb7e4  public-history249.blocks' | sha256sum -c -
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-libevent
      - name: Rebuild complete Windows Core and native guards
        run: |
          cmake -S wallet/riecoin-core-upstream-v2606 -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DBUILD_DAEMON=ON -DENABLE_IPC=OFF -DWITH_ZMQ=OFF -DWITH_USDT=OFF -DPGN_DAEMON_OUTPUT_NAME=pgn-core
          cmake --build build-native --parallel 2 --target riecoind pgn-native-audit-settlement-test
      - name: Actual Native blocks wallet maturity relay and reorg
        run: |
          set -euo pipefail
          mkdir -p evidence21
          build-native/bin/pgn-native-audit-settlement-test.exe "$PWD/build-native/guards249" | tee evidence21/guards.jsonl
          "$QUAL_PYTHON" tests/native_grouped249_actual.py --core build-native/bin/pgn-core.exe --history public-history249.blocks --legacy --receipt evidence21/windows-actual.json
      - name: Collect exact Core and imported non-system DLLs
        run: |
          export PGN_NATIVE_SDK="$(cygpath -m "$MINGW_PREFIX")"
          "$QUAL_PYTHON" - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re,shutil,subprocess
          sdk=Path(os.environ['PGN_NATIVE_SDK']);stage=Path('core21');stage.mkdir(exist_ok=True)
          shutil.copy2('build-native/bin/pgn-core.exe',stage/'pgn-core.exe')
          queue=[stage/'pgn-core.exe'];seen=set()
          while queue:
              image=queue.pop()
              if image.name.lower()in seen:continue
              seen.add(image.name.lower())
              imports=re.findall(r'DLL Name:\s*(\S+)',subprocess.check_output([str(sdk/'bin/objdump.exe'),'-p',str(image)],text=True))
              for name in imports:
                  if name.lower()in seen:continue
                  origin=sdk/'bin'/name
                  if origin.is_file():
                      target=stage/name
                      if not target.exists():shutil.copy2(origin,target)
                      queue.append(target)
                  elif not name.lower().startswith(('api-ms-win-','ext-ms-win-')) and not(Path(os.environ['SystemRoot'])/'System32'/name).is_file():raise RuntimeError('Unresolved Core import '+name)
          files=[dict(path=p.name,bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest())for p in sorted(stage.iterdir())if p.is_file()]
          Path('evidence21/CORE-BUILD.json').write_text(json.dumps(dict(source=os.environ['GITHUB_SHA'],version='2026.11.15.21',activation=4096,files=files),indent=2)+'\n')
          PY
      - name: Preserve production candidate and test receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: core21-windows-${{ github.run_id }}
          path: |
            core21
            evidence21
          if-no-files-found: error
          retention-days: 7
