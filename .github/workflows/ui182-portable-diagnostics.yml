name: UI182 native startup diagnostics from the standard Windows download
on:
  push:
    branches: [qualification/ui182-portable-diagnostics-50]
permissions:
  contents: read
jobs:
  diagnose:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /src/update/
            /tests/native_grouped249_actual.py
            /qualification/ui177/legacy-chain.zip
      - name: Download the already qualified archive from the same draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download qa-ui182-win50 --repo $env:GITHUB_REPOSITORY --dir portable-ui182 --pattern PGN-Windows-182.zip
          if ($LASTEXITCODE -ne 0) { throw 'Exact UI182 draft archive unavailable' }
      - name: Verify actual exported startup and recovery evidence
        shell: pwsh
        run: |
          python -m venv .qa-updater
          if ($LASTEXITCODE -ne 0) { throw 'Updater venv failed' }
          & .qa-updater/Scripts/python.exe -m pip install --disable-pip-version-check -r tools/requirements-updater.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned updater dependencies failed' }
          & .qa-updater/Scripts/python.exe tools/qualify_ui182_portable_diagnostics.py
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic qualification failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ui182-portable-diagnostic-proof
          path: |
            ui182-portable-windows/evidence/PORTABLE-DIAGNOSTICS-PASS.json
            ui182-portable-windows/evidence/CORE-STATES.json
          if-no-files-found: warn
          retention-days: 7
