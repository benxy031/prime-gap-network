          path: |
            build-ci/Testing/Temporary/LastTest.log
            build-ci/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Finalize candidate with actual affected-suite status
        id: ui_finalize
        if: ${{ !cancelled() && steps.ui_collect.outcome == 'success' }}
        env:
          PGN_CTEST_OUTCOME: ${{ steps.ui_tests.outcome }}
        run: |
          .ci-python/bin/python - <<'PGN_FINALIZE'
          from pathlib import Path
          import json,os,tarfile
          p=Path('LINUX-UI-BUILD.json')
          v=json.loads(p.read_text());v['qualification']['ctest_outcome']=os.environ['PGN_CTEST_OUTCOME'];v['qualification']['affected_suite_pass']=os.environ['PGN_CTEST_OUTCOME']=='success';v['qualification']['full_suite_pass']=False;v['qualification']['unchanged_base_full_suite_run']=43715553665
          p.write_text(json.dumps(v,indent=2)+'\n',encoding='utf-8')
          with tarfile.open('ui157-ubuntu.tar.gz','w:gz')as a:
              a.add('ui-stage',arcname='ui');a.add(p,arcname=p.name)
          print(json.dumps(v['qualification']))
          PGN_FINALIZE
      - name: Preserve candidate UI-only runtime and qualification status
        if: ${{ !cancelled() && steps.ui_finalize.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ui157-ubuntu-${{ github.run_id }}
          path: ui157-ubuntu.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
