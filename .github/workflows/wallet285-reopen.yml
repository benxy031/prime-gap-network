name: Wallet285 portable startup regression
on:
  workflow_dispatch:
  push:
    branches: [qualification/wallet285-reopen]
permissions:
  contents: read
concurrency:
  group: wallet285-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: UCRT64 all targets and isolated tests
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Enable long source paths on the disposable runner
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /CMakeLists.txt
            /cmake/
            /src/
            /tests/
            /tools/
            /data/
            /qualification/wallet285/
            /wallet/riecoin-core-upstream-v2606/src/pgn/currency_constants.h
            /assets/pgn.qrc
            /assets/pgn-horizon.rc.in
            /assets/*.ico
            /assets/pgn-mark.png
            /assets/chevron-down.svg
            /assets/chevron-up.svg
            /assets/checkbox-tick.svg


      - name: Bootstrap MSYS2 without the failing geo-mirror update
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: false

      - name: Select the official primary package server
        run: |
          printf '%s\n' 'Server = https://repo.msys2.org/mingw/$repo/' > /etc/pacman.d/mirrorlist.mingw
          printf '%s\n' 'Server = https://repo.msys2.org/msys/$arch/' > /etc/pacman.d/mirrorlist.msys

      - name: Apply the full base update and recognize its documented terminal restart
        shell: pwsh
        run: |
          $pgnUpdateOutput = & msys2 -c 'pacman --noconfirm -Syuu' 2>&1
          $pgnUpdateExit = $LASTEXITCODE
          $pgnUpdateOutput | Out-Host
          $pgnUpdateText = $pgnUpdateOutput -join "`n"
          $pgnExpectedRestart = $pgnUpdateText.Contains('To complete this update all MSYS2 processes including this terminal will be closed.')
          if ($pgnUpdateExit -ne 0 -and -not ($pgnUpdateExit -eq 1 -and $pgnExpectedRestart)) {
            throw "MSYS2 base update failed with exit $pgnUpdateExit"
          }
          exit 0

      - name: Finish the full system update in a fresh MSYS2 session
        run: pacman --noconfirm -Syu

      - name: Install the authenticated UCRT64 build dependencies
        run: |
          pacman --noconfirm --needed -S \
            mingw-w64-ucrt-x86_64-gcc \
            mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-ninja \
            mingw-w64-ucrt-x86_64-qt6-base \
            mingw-w64-ucrt-x86_64-gmp \
            mingw-w64-ucrt-x86_64-sqlite3 \
            mingw-w64-ucrt-x86_64-zlib \
            mingw-w64-ucrt-x86_64-boost

      - name: Record the actual tool versions
        run: |
          g++ --version
          cmake --version
          ninja --version
          pacman -Q mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-sqlite3 mingw-w64-ucrt-x86_64-gmp


      - name: Compile original and corrected managed-Core paths
        run: |
          cmake -S qualification/wallet285 -B build-wallet285 -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wallet285 --target baseline candidate defaultwallet --parallel 2
          cmake -S . -B build-wallet285-app -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wallet285-app --target pgn-wallet-fresh-setup-view-test pgn-core-profile-test PGN-Horizon --parallel 4
      - name: Reproduce original failure and verify wallet-preserving correction
        run: |
          ctest --test-dir build-wallet285 --output-on-failure
          build-wallet285-app/pgn-core-profile-test.exe
          build-wallet285-app/pgn-wallet-fresh-setup-view-test.exe
      - name: Collect exact test binaries
        run: |
          mkdir -p wallet285-qa
          cp build-wallet285/baseline.exe build-wallet285/candidate.exe build-wallet285/defaultwallet.exe build-wallet285-app/PGN-Horizon.exe wallet285-qa/
          printf '%s\n' "$GITHUB_SHA" > wallet285-qa/SOURCE.txt
          qmake6 -query QT_VERSION > wallet285-qa/QT_VERSION.txt
          sha256sum wallet285-qa/*.exe > wallet285-qa/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wallet285-qa-windows
          path: wallet285-qa
          if-no-files-found: error
