name: PGN Horizon audit RPC verified indexed reads
on:
  push:
    branches: [qualification/r217-audit-indexed-paired]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reuse available compiler tools and fetch only missing signed packages
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          needed=()
          command -v g++ >/dev/null || needed+=(build-essential)
          command -v cmake >/dev/null || needed+=(cmake)
          command -v ninja >/dev/null || needed+=(ninja-build)
          command -v pkg-config >/dev/null || needed+=(pkg-config)
          pkg-config --exists gmp 2>/dev/null || needed+=(libgmp-dev)
          pkg-config --exists sqlite3 2>/dev/null || needed+=(libsqlite3-dev)
          pkg-config --exists libevent_core libevent_extra libevent_pthreads 2>/dev/null || needed+=(libevent-dev)
          [[ -f /usr/include/boost/version.hpp ]] || needed+=(libboost-dev)
          if (( ${#needed[@]} > 0 )); then
            index="$RUNNER_TEMP/pgn-native-ubuntu.list"
            key='/usr/share/keyrings/ubuntu-archive-keyring.gpg'
            test -r "$key"
            printf 'deb [signed-by=%s] https://archive.ubuntu.com/ubuntu noble main universe
' "$key" > "$index"
            printf 'deb [signed-by=%s] https://archive.ubuntu.com/ubuntu noble-updates main universe
' "$key" >> "$index"
            printf 'deb [signed-by=%s] https://security.ubuntu.com/ubuntu noble-security main universe
' "$key" >> "$index"
            flags=(-o "Dir::Etc::sourcelist=$index" -o 'Dir::Etc::sourceparts=-' -o 'Acquire::http::Timeout=22' -o 'Acquire::https::Timeout=22' -o 'Acquire::Retries=1')
            sudo apt-get "${flags[@]}" update
            sudo apt-get "${flags[@]}" install --no-install-recommends -y "${needed[@]}"
          fi
      - name: Compile the published source projection and the indexed variant under identical settings
        shell: bash
        run: |
          set -euo pipefail
          original=9717e8c3eb1bc7b59ebee970e539423b716f9ddb
          first=wallet/riecoin-core-upstream-v2606/src/pgn/rpc_audit_incremental.h
          second=wallet/riecoin-core-upstream-v2606/src/rpc/pgn_native.cpp
          mkdir -p paired-results
          git fetch --no-tags --depth=1 origin "$original"
          git restore --source="$original" -- "$first" "$second"
          cmake -S wallet/riecoin-core-upstream-v2606 -B build-paired -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DBUILD_DAEMON=ON -DENABLE_IPC=OFF -DWITH_ZMQ=OFF -DWITH_USDT=OFF -DPGN_DAEMON_OUTPUT_NAME=pgn-core
          cmake --build build-paired --parallel 3 --target riecoind
          cp build-paired/bin/pgn-core paired-results/control-core
          git restore --source="${GITHUB_SHA}" -- "$first" "$second"
          cmake --build build-paired --parallel 3 --target riecoind
          cp build-paired/bin/pgn-core paired-results/indexed-core
          sha256sum paired-results/control-core paired-results/indexed-core
      - name: Compare exact parsed results, branch rollback, and paired timings
        run: python qualification/audit-r217/compare_audit_snapshot.py --baseline paired-results/control-core --indexed paired-results/indexed-core --fixture qualification/audit-r217/paired-public-audit-replay.zip --receipt paired-results/RESULT.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: audit-indexed-paired-${{ github.run_id }}
          path: paired-results/RESULT.json
          retention-days: 7
