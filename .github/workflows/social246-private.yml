name: Private Social246 existing V2 consent path
on:
  push:
    branches: [qualification/social246-consent]
permissions:
  contents: read
concurrency:
  group: social246-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-private:
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Preserve exact source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preflight exact base object before expensive build
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 https://github.com/wizz13150/prime-gap-network.git 840f5168022084f81ff9a819e67cd646c339ea73
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          git cat-file -e '840f5168022084f81ff9a819e67cd646c339ea73^{commit}'
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-libevent
      - name: Configure exact public Core21 plus isolated Social overlay
        run: |
          cmake -S wallet/riecoin-core-upstream-v2606 -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTS=OFF -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DBUILD_BITCOIN_BIN=OFF -DENABLE_IPC=OFF -DWITH_ZMQ=OFF -DWITH_USDT=OFF
      - name: Compile affected native objects before full build
        env:
          PYTHON_EXPLICIT: ${{ steps.python.outputs.python-path }}
        run: |
          qa_python="$(cygpath -u "$PYTHON_EXPLICIT")"
          export CMAKE_EXPLICIT="$(cygpath -w "$(command -v cmake)")"
          qa_cwd="$(cygpath -w "$PWD")"
          "$qa_python" -B tools/social223_bounded_windows.py --cwd "$qa_cwd" --receipt "$qa_cwd/consent-preflight-resource.json" --timeout 600 -- "$PYTHON_EXPLICIT" -B tools/social246_preflight.py > consent-preflight.log 2>&1
      - name: Build at Idle priority, one compiler, bounded2.5GiB
        id: build
        env:
          PYTHON_EXPLICIT: ${{ steps.python.outputs.python-path }}
        run: |
          qa_python="$(cygpath -u "$PYTHON_EXPLICIT")"
          qa_cmake="$(cygpath -w "$(command -v cmake)")"
          qa_cwd="$(cygpath -w "$PWD")"
          "$qa_python" -B tools/social223_bounded_windows.py --cwd "$qa_cwd" --receipt "$qa_cwd/build-resource.json" --timeout 2300 -- "$qa_cmake" --build build-native --parallel 1 --target riecoind > build-private.log 2>&1
      - name: Collect executable and actual DLL closure before tests
        id: export_public
        if: steps.build.outcome == 'success'
        env:
          PYTHON_EXPLICIT: ${{ steps.python.outputs.python-path }}
        run: |
          qa_python="$(cygpath -u "$PYTHON_EXPLICIT")"
          qa_tools="$(cygpath -w "$MINGW_PREFIX/bin")"
          "$qa_python" -B tools/social223_export.py --tool-bin "$qa_tools"
      - name: Preserve exact native link SDK before tests
        id: export_sdk
        if: always() && steps.export_public.outcome == 'success'
        continue-on-error: true
        env:
          PYTHON_EXPLICIT: ${{ steps.python.outputs.python-path }}
        run: |
          qa_python="$(cygpath -u "$PYTHON_EXPLICIT")"
          "$qa_python" -B tools/social246_sdk_export.py
      - name: Rescue built Core independently of every later test/collector
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: social223-default-off-core-rescue-windows
          path: private-social223-delivery
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
      - name: Verify actual production-default absence with complete native profile
        if: steps.export_public.outcome == 'success'
        shell: pwsh
        env:
          PYTHON_EXPLICIT: ${{ steps.python.outputs.python-path }}
        run: |
          $env:Path="$env:SystemRoot\System32;$env:SystemRoot"
          & $env:PYTHON_EXPLICIT -B tools/social223_bounded_windows.py --cwd "$pwd" --receipt "$pwd/public-off-resource.json" --timeout 120 -- $env:PYTHON_EXPLICIT -B tests/social_moderation_public_absence.py --core private-social223-delivery/Core/pgn-core.exe --out private-public-default-off
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Real native context unavailable then recovered without worker termination
        if: steps.export_public.outcome == 'success'
        shell: pwsh
        env:
          PYTHON_EXPLICIT: ${{ steps.python.outputs.python-path }}
        run: |
          & $env:PYTHON_EXPLICIT -B tools/social223_bounded_windows.py --cwd "$pwd" --receipt "$pwd/context-smoke-resource.json" --timeout 240 -- $env:PYTHON_EXPLICIT -B tests/social_context_smoke.py --core private-social223-delivery/Core/pgn-core.exe --protocol . --out private-social-context-smoke
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Build dedicated Native association components, never global tests
        id: components
        if: steps.export_public.outcome == 'success'
        env:
          PYTHON_EXPLICIT: ${{ steps.python.outputs.python-path }}
        run: |
          qa_python="$(cygpath -u "$PYTHON_EXPLICIT")"
          qa_cmake="$(cygpath -w "$(command -v cmake)")"
          qa_cwd="$(cygpath -w "$PWD")"
          "$qa_python" -B tools/social223_bounded_windows.py --cwd "$qa_cwd" --receipt "$qa_cwd/components-build-resource.json" --timeout 600 -- "$qa_cmake" --build build-native --parallel 1 --target pgn-social-consent-prepare-test pgn-social-consent-pending-test pgn-social-committed-identity-test > components-build.log 2>&1
      - name: Check actual Native archive, dual BIP322, rollback and request isolation
        if: steps.components.outcome == 'success'
        shell: pwsh
        env:
          PYTHON_EXPLICIT: ${{ steps.python.outputs.python-path }}
        run: |
          & $env:PYTHON_EXPLICIT -B tools/social246_components.py
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Preserve OFF image and compile only private-gated TU plus link
        id: build_private
        if: steps.export_public.outcome == 'success'
        env:
          PYTHON_EXPLICIT: ${{ steps.python.outputs.python-path }}
        run: |
          mkdir -p private-social223-delivery/public-default-off
          cp -r private-social223-delivery/Core private-social223-delivery/public-default-off/
          cp private-social223-delivery/PRETEST-CORE-EXPORT.json private-social223-delivery/public-default-off/
          cmake -S wallet/riecoin-core-upstream-v2606 -B build-native -DPGN_SOCIAL_PRIVATE_QUALIFICATION=ON
          qa_python="$(cygpath -u "$PYTHON_EXPLICIT")"
          qa_cmake="$(cygpath -w "$(command -v cmake)")"
          qa_cwd="$(cygpath -w "$PWD")"
          "$qa_python" -B tools/social223_bounded_windows.py --cwd "$qa_cwd" --receipt "$qa_cwd/private-build-resource.json" --timeout 180 -- "$qa_cmake" --build build-native --parallel 1 --target riecoind > private-mode-build.log 2>&1
          qa_tools="$(cygpath -w "$MINGW_PREFIX/bin")"
          "$qa_python" -B tools/social223_export.py --tool-bin "$qa_tools"
      - name: Rescue private-mode executable before the network witness
        if: always() && steps.build_private.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: social223-private-mode-core-rescue-windows
          path: private-social223-delivery
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
      - name: Two real closed-network peers, BIP322, native CDB and ACL
        id: test
        if: steps.build_private.outcome == 'success'
        shell: pwsh
        env:
          PYTHON_EXPLICIT: ${{ steps.python.outputs.python-path }}
        run: |
          $env:Path="$env:SystemRoot\System32;$env:SystemRoot"
          & $env:PYTHON_EXPLICIT -B tools/social223_bounded_windows.py --cwd "$pwd" --receipt "$pwd/test-resource.json" --timeout 300 -- $env:PYTHON_EXPLICIT -B tests/social_moderation_native.py --core private-social223-delivery/Core/pgn-core.exe --out private-social223-test
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Compact immutable source/product receipts; never upload wallets
        if: always()
        shell: pwsh
        env:
          PYTHON_EXPLICIT: ${{ steps.python.outputs.python-path }}
        run: |
          & $env:PYTHON_EXPLICIT -B tools/collect_social223.py --build-outcome '${{ steps.build.outcome }}' --test-outcome '${{ steps.test.outcome }}'
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: social223-private-native-windows
          path: private-social223-delivery
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
