name: UI180 Windows previous shortcut and audit continuity
on:
  push:
    branches: [qualification/ui180-shortcut-audit-48]
permissions:
  contents: read
jobs:
  windows:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - name: Allow long test source paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /src/update/
            /tests/native_grouped249_actual.py
            /qualification/ui177/legacy-chain.zip
            /qualification/ui179/audit-frames.json
      - name: Fetch the exact candidate from the unpublished draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download qa-ui180-win48 --repo $env:GITHUB_REPOSITORY --dir signed-candidate-48 --pattern "qa-catalogue48-metadata.zip" --pattern "*.components-48.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Qualification draft assets unavailable' }
      - name: Prepare pinned verification dependencies
        shell: pwsh
        run: |
          python -m venv .qa-updater
          if ($LASTEXITCODE -ne 0) { throw 'Updater venv failed' }
          & .qa-updater/Scripts/python.exe -m pip install --disable-pip-version-check -r tools/requirements-updater.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned updater dependencies failed' }
      - name: Run the signed Windows update and reopen its previous launch path
        shell: pwsh
        run: |
          & .qa-updater/Scripts/python.exe tools/qualify_ui180_shortcut_audit.py
          if ($LASTEXITCODE -ne 0) { throw 'Previous Windows launch path or audit continuity failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ui180-shortcut-audit-${{ github.run_id }}
          path: ui180-shortcut-audit-windows/evidence/
          if-no-files-found: warn
          retention-days: 7
