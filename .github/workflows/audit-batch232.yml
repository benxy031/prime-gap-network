name: Native signed audit batches 232
on:
  workflow_dispatch:
  push:
    branches: [qualification/audit-batch232]
permissions:
  contents: read
  actions: read
jobs:
  native-audit-batches:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reuse the immutable Core build with identical RPC inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B tools/fetch_audit_batch232_core.py
      - name: Preserve recovery and immutable answer contracts
        run: |
          python3 -B tests/test_audit_batch.py
          python3 -B tests/test_audit_assignment_reservation.py
          python3 -B tests/test_audit_assignment_durability.py
          python3 -B tests/test_assigned_audit_recovery.py
          python3 -B tests/test_network_audit_lifecycle.py
          python3 -B tests/test_retained_audit_signer.py
          python3 -B tests/test_mining_flow_cycle.py
      - name: Three accepted blocks with actual signatures and disposable Core
        run: python3 -B tests/native_audit_batch_rpc.py --core batch232/riecoind --receipt batch232/THREE-BLOCKS.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-audit-batch232
          if-no-files-found: warn
          retention-days: 7
          path: |
            batch232/THREE-BLOCKS.json
            batch232/CORE-REUSE.json
