      - name: Run registered isolated tests
        id: ui_tests
        env:
          QT_QPA_PLATFORM: offscreen
          GSETTINGS_BACKEND: memory
        run: ctest --test-dir build-ci --output-on-failure --timeout 180 -j2
      - name: Check audit lifecycle and grouped publication regressions
        if: ${{ !cancelled() && steps.ui_build.outcome == 'success' }}
        run: |
          .ci-python/bin/python -I tests/test_late_cycle_completion.py
          .ci-python/bin/python -I tests/test_audit_reveal_batch.py
          .ci-python/bin/python -I tests/test_shared_audit_reveals.py
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ubuntu-source-tests-${{ github.run_id }}
          path: |
            build-ci/Testing/Temporary/LastTest.log
            build-ci/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Finalize candidate with actual full-suite status
        id: ui_finalize
        if: ${{ !cancelled() && steps.ui_collect.outcome == 'success' }}
        env:
          PGN_CTEST_OUTCOME: ${{ steps.ui_tests.outcome }}
        run: |
          .ci-python/bin/python - <<'PGN_FINALIZE'
          from pathlib import Path
          import json,os,tarfile
          p=Path('LINUX-UI-BUILD.json')
          v=json.loads(p.read_text());v['qualification']['ctest_outcome']=os.environ['PGN_CTEST_OUTCOME'];v['qualification']['full_suite_pass']=os.environ['PGN_CTEST_OUTCOME']=='success'
