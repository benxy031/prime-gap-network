name: UI161 Windows corrected contract with native Python artifact retrieval
on:
  workflow_dispatch:
  push:
    branches: [qualification/ui161-runtime-windows]
permissions:
  contents: read
  actions: read
concurrency:
  group: ui161-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    name: UCRT64 all targets and isolated tests
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Enable long source paths on the disposable runner
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2


      - name: Install the UCRT64 build dependencies
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-boost

      - name: Install pinned updater test dependencies
        shell: pwsh
        run: |
          python -m venv .ci-python
          if ($LASTEXITCODE -ne 0) { throw "Python test environment creation failed" }
          & ./.ci-python/Scripts/python.exe -m pip install --disable-pip-version-check -r tools/requirements-updater.txt
          if ($LASTEXITCODE -ne 0) { throw "Pinned updater test dependencies failed" }

      - name: Record the actual tool versions
        run: |
          g++ --version
          cmake --version
          ninja --version
          pacman -Q mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-sqlite3 mingw-w64-ucrt-x86_64-gmp

      - name: Preflight exact product and collector prerequisites
        run: |
          export PGN_UI_SDK="$(cygpath -m "$MINGW_PREFIX")"
          .ci-python/Scripts/python.exe - <<'PGN_PREFLIGHT'
          from pathlib import Path
          import os,shutil,subprocess,hashlib,json
          expected={'source': os.environ['GITHUB_SHA'], 'tree': subprocess.check_output([shutil.which('git') or 'C:/Program Files/Git/bin/git.exe','rev-parse','HEAD^{tree}'],text=True).strip(), 'verified_files': [{'path': 'CMakeLists.txt', 'patched_sha256': 'a1a6d84ce3869b845f45459815c8b8c14ae76efa325e7685ccd94dada97dab60'}, {'path': 'qualification/social246-native-display/build_index_test.py', 'patched_sha256': '5338a7035e17edeb83b96c5353db554e1fb54af1de346a32a091a07edb58bf1f'}, {'path': 'qualification/social246-native-display/compile_native_targets.py', 'patched_sha256': 'b2e6efcb2aac525016920d95e0542f6345dfb4c47fd7c5b1ccfd1e4079a160a4'}, {'path': 'qualification/social246-native-display/generate_index_fixture.py', 'patched_sha256': 'a8dd79f9ec7b2cfe43a2aae2bd4fcc1f26f96e5bc6caa45cec71eeaf87c3d960'}, {'path': 'qualification/social246-native-display/index_store_test.cpp', 'patched_sha256': '90c3694d734f0ecfcd30e7b22d21b99bdb0916fa0f791c9815dd2741c17b7abb'}, {'path': 'qualification/social246-native-display/link_offchain_relay.py', 'patched_sha256': '015c870d290920ca3550f75e2fb7eca3fef948bb00acd5dc2fe0e07b548b3937'}, {'path': 'qualification/social246-native-display/native_display_relay_test.py', 'patched_sha256': '1d435b0e8c4a3b47a6b73ef3f51d8275eedf467c26410c1e61ab4e8b4e0164c1'}, {'path': 'qualification/social246-native-display/qt/CMakeLists.txt', 'patched_sha256': 'bf36e093f0f8cff93412b1d94eaf7df087bcf1749b4786cbd86851f2f9bbe9e1'}, {'path': 'qualification/social246-native-display/qt/current_display_consent.h', 'patched_sha256': '8db553b957a252b477f929e5d448e338b57f6b0c048b4bc3dd205c230b34ce3c'}, {'path': 'qualification/social246-native-display/qt/native_display_resolver.h', 'patched_sha256': 'e5cebfa0d497c88068c9955200ca43eb02bc523cb94fc254370c3c817fc3ed5c'}, {'path': 'qualification/social246-native-display/qt/offchain_display_store.h', 'patched_sha256': '38d5af7fbe1d4f6d32a1b75c712a89d6e7204450620e15969aee72e87f106700'}, {'path': 'qualification/social246-native-dis