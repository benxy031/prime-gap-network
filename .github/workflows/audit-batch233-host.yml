name: Private audit batch host84 qualification
on:
  workflow_dispatch:
  push:
    branches: [qualification/host84-guard243]
    paths:
      - src/engine/runtime_host/**
      - tests/native_audit_batch_rpc.py
      - tests/test_audit_batch.py
      - tools/build_audit_batch233_host.py
      - tools/fetch_audit_batch233_core.py
      - .github/workflows/audit-batch233-host.yml
permissions:
  contents: read
  actions: read
jobs:
  host-and-real-core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: ubuntu
            core: pgn-core
          - os: windows-latest
            platform: windows
            core: pgn-core.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Preserve exact input bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact Core20 component and verify every Core source input
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B tools/fetch_audit_batch233_core.py --platform ${{ matrix.platform }}
      - name: Targeted public control and retained scientific guards
        shell: python
        run: |
          import subprocess,sys
          for name in ('test_audit_batch.py','test_mining_flow_cycle.py','test_retained_audit_signer.py','test_network_audit_publication.py','test_network_audit_lifecycle.py','test_assigned_audit_recovery.py','test_audit_reveal_batch.py','test_shared_audit_reveals.py','test_report_maintenance_poll.py','test_audit_actor_transition.py','test_cpu_only_source.py','test_network_cpu_source.py','test_audit_cycle_publication.py','test_core_outage_recovery.py','test_audit_cycle_reassignment.py','test_deferred_complement.py','test_audit_partition_archive.py','test_publication_turn_recovery.py','test_audit_seal_recovery.py','test_hourly_runtime_target.py','test_cpu_normal_flow.py'):
              subprocess.run([sys.executable,'-B','tests/'+name],check=True)
      - name: Actual signed three-block cycle and expired/reassigned journal recovery
        run: python -B tests/native_audit_batch_rpc.py --core qa233/Core/${{ matrix.core }} --receipt qa233/THREE-BLOCKS-AND-RECOVERY.json
      - name: Pinned existing host freezer only
        run: python -m pip install --disable-pip-version-check -r tools/requirements-engine-host.txt
      - name: Freeze host84 and execute its audit-only self-test
        run: python -B tools/build_audit_batch233_host.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-batch233-host-${{ matrix.platform }}
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
          path: |
            qa233/CORE-REUSE.json
            qa233/THREE-BLOCKS-AND-RECOVERY.json
            host233/runtime
            host233/ENGINE-HOST-SOURCE.json
            host233/BINARY-FILES.json
            host233/BUILD-RECEIPT.json
            host233/HOST-SELFTEST.json
