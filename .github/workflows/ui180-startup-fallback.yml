name: Horizon startup fallback and end-to-end diagnostics
on:
  workflow_dispatch:
  push:
    branches: [qualification/ui180-startup-fallback]
permissions:
  contents: read
  actions: read
concurrency:
  group: startup-fallback-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows source build and actual recovery
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Enable long source paths on the disposable runner
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /CMakeLists.txt
            /cmake/
            /src/
            /tests/
            /tools/
            /data/
            /qualification/ui177/legacy-chain.zip
            /qualification/names286/
            /qualification/names303/
            /qualification/statistics309/
            /qualification/social278-qt/
            /qualification/social278-access/
            /qualification/wallet285/
            /qualification/cpu296/
            /wallet/riecoin-core-upstream-v2606/src/
            /assets/
            /third_party/


      - name: Bootstrap MSYS2 without the failing geo-mirror update
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: false

      - name: Select the official primary package server
        run: |
          printf '%s\n' 'Server = https://repo.msys2.org/mingw/$repo/' > /etc/pacman.d/mirrorlist.mingw
          printf '%s\n' 'Server = https://repo.msys2.org/msys/$arch/' > /etc/pacman.d/mirrorlist.msys

      - name: Apply the full base update and recognize its documented terminal restart
        shell: pwsh
        run: |
          $pgnUpdateOutput = & msys2 -c 'pacman --noconfirm -Syuu' 2>&1
          $pgnUpdateExit = $LASTEXITCODE
          $pgnUpdateOutput | Out-Host
          $pgnUpdateText = $pgnUpdateOutput -join "`n"
          $pgnExpectedRestart = $pgnUpdateText.Contains('To complete this update all MSYS2 processes including this terminal will be closed.')
          if ($pgnUpdateExit -ne 0 -and -not ($pgnUpdateExit -eq 1 -and $pgnExpectedRestart)) {
            throw "MSYS2 base update failed with exit $pgnUpdateExit"
          }
          exit 0

      - name: Finish the full system update in a fresh MSYS2 session
        run: pacman --noconfirm -Syu

      - name: Install the authenticated UCRT64 build dependencies
        run: |
          pacman --noconfirm --needed -S \
            mingw-w64-ucrt-x86_64-gcc \
            mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-ninja \
            mingw-w64-ucrt-x86_64-qt6-base \
            mingw-w64-ucrt-x86_64-gmp \
            mingw-w64-ucrt-x86_64-sqlite3 \
            mingw-w64-ucrt-x86_64-zlib \
            mingw-w64-ucrt-x86_64-boost


      - name: Prepare the runner Python for the worker fixture
        shell: pwsh
        run: |
          $pythonPath = (Get-Command python.exe).Source.Replace('\', '/')
          "PGN_TEST_PYTHON=$pythonPath" >> $env:GITHUB_ENV
      - name: Build and test the exact Windows application
        run: |
          set -euo pipefail
          cmake -S . -B build-app -G Ninja -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$PGN_TEST_PYTHON"
          cmake --build build-app --target PGN-Horizon --parallel 4
          mkdir -p qualified
          cp build-app/PGN-Horizon.exe qualified/
          echo "$GITHUB_SHA" > qualified/SOURCE.txt
          qmake6 -query QT_VERSION > qualified/QT_VERSION.txt
          sha256sum qualified/PGN-Horizon.exe build-app/assets/audit-animation.rcc > qualified/SHA256SUMS.txt
      - name: Fetch the exact candidate from the unpublished draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download qa-ui180-win48 --repo $env:GITHUB_REPOSITORY --dir signed-candidate-48 --pattern "qa-catalogue48-metadata.zip" --pattern "*.components-48.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Qualification draft assets unavailable' }
      - name: Prepare pinned verification dependencies
        shell: pwsh
        run: |
          python -m venv .qa-updater
          if ($LASTEXITCODE -ne 0) { throw 'Updater venv failed' }
          & .qa-updater/Scripts/python.exe -m pip install --disable-pip-version-check -r tools/requirements-updater.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned updater dependencies failed' }
      - name: Export real late diagnostics from the exact Windows candidate
        shell: pwsh
        run: |
          & .qa-updater/Scripts/python.exe tools/qualify_startup_fallback.py
          if ($LASTEXITCODE -ne 0) { throw 'Native diagnostics qualification failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ui180-startup-fallback-${{ github.run_id }}
          path: |
            qualified/SOURCE.txt
            qualified/QT_VERSION.txt
            qualified/SHA256SUMS.txt
            qualified/PGN-Horizon.exe
            ui180-startup-fallback-windows/evidence/
          if-no-files-found: warn
          retention-days: 7
