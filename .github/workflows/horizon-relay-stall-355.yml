name: Qualify Horizon recovery from peer relay stalls
on:
  workflow_dispatch:
  push:
    branches: [qualification/horizon-relay-stall-355]
permissions:
  contents: read
  actions: read
concurrency:
  group: relay-stall-355-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: UCRT64 all targets and isolated tests
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Enable long source paths on the disposable runner
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /CMakeLists.txt
            /cmake/
            /src/
            /tests/
            /tools/
            /data/
            /qualification/names286/
            /qualification/names303/
            /qualification/statistics309/
            /qualification/social278-qt/
            /qualification/social278-access/
            /qualification/wallet285/
            /qualification/cpu296/
            /wallet/riecoin-core-upstream-v2606/src/
            /assets/
            /third_party/


      - name: Bootstrap MSYS2 without the failing geo-mirror update
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: false

      - name: Select the official primary package server
        run: |
          printf '%s\n' 'Server = https://repo.msys2.org/mingw/$repo/' > /etc/pacman.d/mirrorlist.mingw
          printf '%s\n' 'Server = https://repo.msys2.org/msys/$arch/' > /etc/pacman.d/mirrorlist.msys

      - name: Apply the full base update and recognize its documented terminal restart
        shell: pwsh
        run: |
          $pgnUpdateOutput = & msys2 -c 'pacman --noconfirm -Syuu' 2>&1
          $pgnUpdateExit = $LASTEXITCODE
          $pgnUpdateOutput | Out-Host
          $pgnUpdateText = $pgnUpdateOutput -join "`n"
          $pgnExpectedRestart = $pgnUpdateText.Contains('To complete this update all MSYS2 processes including this terminal will be closed.')
          if ($pgnUpdateExit -ne 0 -and -not ($pgnUpdateExit -eq 1 -and $pgnExpectedRestart)) {
            throw "MSYS2 base update failed with exit $pgnUpdateExit"
          }
          exit 0

      - name: Finish the full system update in a fresh MSYS2 session
        run: pacman --noconfirm -Syu

      - name: Install the authenticated UCRT64 build dependencies
        run: |
          pacman --noconfirm --needed -S \
            mingw-w64-ucrt-x86_64-gcc \
            mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-ninja \
            mingw-w64-ucrt-x86_64-qt6-base \
            mingw-w64-ucrt-x86_64-gmp \
            mingw-w64-ucrt-x86_64-sqlite3 \
            mingw-w64-ucrt-x86_64-zlib \
            mingw-w64-ucrt-x86_64-boost


      - name: Prepare the runner Python for the worker fixture
        shell: pwsh
        run: |
          $pythonPath = (Get-Command python.exe).Source.Replace('\', '/')
          "PGN_TEST_PYTHON=$pythonPath" >> $env:GITHUB_ENV
      - name: Build and test the exact Windows application
        run: |
          set -euo pipefail
          cmake -S . -B build-app -G Ninja -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$PGN_TEST_PYTHON"
          cmake --build build-app --target pgn-audit-partition-widgets-test pgn-mining-preparation-progress-test pgn-mining-live-refresh-test pgn-network-work-view-test pgn-ticket-atlas-view-test pgn-core-runtime-network-test pgn-core-link-state-test pgn-peer-bootstrap-test pgn-core-rpc-stream-test --parallel 3
          QT_QPA_PLATFORM=offscreen ctest --test-dir build-app --output-on-failure -R '^(audit-partition-widgets|mining-preparation-progress|mining-live-refresh|whole-audit-progress|network-work-view|core-runtime-network|core-link-state|peer-bootstrap|core-rpc-stream)$'
          cmake --build build-app --target PGN-Horizon --parallel 4
          mkdir -p qualified
          cp build-app/PGN-Horizon.exe qualified/
          echo "$GITHUB_SHA" > qualified/SOURCE.txt
          qmake6 -query QT_VERSION > qualified/QT_VERSION.txt
          sha256sum qualified/PGN-Horizon.exe > qualified/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: horizon-relay-stall355-windows-${{ github.run_id }}
          path: |
            qualified
            build-app/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 7
