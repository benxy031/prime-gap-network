name: Qualify Horizon Core read recovery under delayed local RPC
on:
  workflow_dispatch:
  push:
    branches: [qualification/horizon-core-rpc-resilience]
permissions:
  contents: read
concurrency:
  group: horizon-core-rpc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: UCRT64 all targets and isolated tests
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Enable long source paths on the disposable runner
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /CMakeLists.txt
            /cmake/
            /src/
            /tests/
            /tools/
            /data/
            /qualification/names286/
            /qualification/names303/
            /qualification/statistics309/
            /qualification/social278-qt/
            /qualification/social278-access/
            /qualification/wallet285/
            /qualification/cpu296/
            /wallet/riecoin-core-upstream-v2606/src/
            /assets/
            /third_party/


      - name: Bootstrap MSYS2 without the failing geo-mirror update
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: false

      - name: Select the official primary package server
        run: |
          printf '%s\n' 'Server = https://repo.msys2.org/mingw/$repo/' > /etc/pacman.d/mirrorlist.mingw
          printf '%s\n' 'Server = https://repo.msys2.org/msys/$arch/' > /etc/pacman.d/mirrorlist.msys

      - name: Apply the full base update and recognize its documented terminal restart
        shell: pwsh
        run: |
          $pgnUpdateOutput = & msys2 -c 'pacman --noconfirm -Syuu' 2>&1
          $pgnUpdateExit = $LASTEXITCODE
          $pgnUpdateOutput | Out-Host
          $pgnUpdateText = $pgnUpdateOutput -join "`n"
          $pgnExpectedRestart = $pgnUpdateText.Contains('To complete this update all MSYS2 processes including this terminal will be closed.')
          if ($pgnUpdateExit -ne 0 -and -not ($pgnUpdateExit -eq 1 -and $pgnExpectedRestart)) {
            throw "MSYS2 base update failed with exit $pgnUpdateExit"
          }
          exit 0

      - name: Finish the full system update in a fresh MSYS2 session
        run: pacman --noconfirm -Syu

      - name: Install the authenticated UCRT64 build dependencies
        run: |
          pacman --noconfirm --needed -S \
            mingw-w64-ucrt-x86_64-gcc \
            mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-ninja \
            mingw-w64-ucrt-x86_64-qt6-base \
            mingw-w64-ucrt-x86_64-gmp \
            mingw-w64-ucrt-x86_64-sqlite3 \
            mingw-w64-ucrt-x86_64-zlib \
            mingw-w64-ucrt-x86_64-boost

      - name: Reproduce the timeout and exercise the separate inspection pool
        run: |
          cmake -S . -B build-app -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-app --target pgn-core-rpc-stream-test --parallel 3
          ctest --test-dir build-app -R '^core-rpc-stream$' --output-on-failure
      - name: Build the real application and protect actual wallet and identity paths
        run: |
          cmake --build build-app --target PGN-Horizon pgn-core-rpc-test pgn-core-runtime-network-test pgn-wallet-setup-test pgn-wallet-setup-change-test pgn-managed-core-profile-test pgn-chain-observation-test --parallel 4
          QT_QPA_PLATFORM=offscreen ctest --test-dir build-app -R '^(core-rpc|core-runtime-network|wallet-setup|wallet-setup-change|managed-core-profile|chain-observation)$' --output-on-failure
          mkdir -p horizon-rpc-qualification
          cp build-app/PGN-Horizon.exe horizon-rpc-qualification/
          printf '%s\n' "$GITHUB_SHA" > horizon-rpc-qualification/SOURCE.txt
          qmake6 -query QT_VERSION > horizon-rpc-qualification/QT_VERSION.txt
          sha256sum horizon-rpc-qualification/*.exe > horizon-rpc-qualification/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success()
        with:
          name: horizon-rpc-resilience-windows
          path: horizon-rpc-qualification
          if-no-files-found: error
          retention-days: 7
