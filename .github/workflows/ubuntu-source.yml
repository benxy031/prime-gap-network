name: Epoch3 application and frozen helpers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: UCRT64 all targets and isolated tests
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Enable long source paths on the disposable runner
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the UCRT64 build dependencies
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-boost

      - name: Install pinned updater test dependencies
        shell: pwsh
        run: |
          python -m venv .ci-python
          if ($LASTEXITCODE -ne 0) { throw "Python test environment creation failed" }
          & ./.ci-python/Scripts/python.exe -m pip install --disable-pip-version-check -r tools/requirements-updater.txt
          if ($LASTEXITCODE -ne 0) { throw "Pinned updater test dependencies failed" }

      - name: Record the actual tool versions
        run: |
          g++ --version
          cmake --version
          ninja --version
          pacman -Q mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-sqlite3 mingw-w64-ucrt-x86_64-gmp

      - name: Configure a clean Release tree
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$PWD/.ci-python/Scripts/python.exe"

      - name: Build every default source target
        run: |
          pgn_build_jobs="$(nproc)"
          if [ "$pgn_build_jobs" -gt 4 ]; then pgn_build_jobs=4; fi
          printf 'Build workers: %s\n' "$pgn_build_jobs"
          cmake --build build-ci --parallel "$pgn_build_jobs"

      - name: Run the isolated registered tests
        env:
          QT_QPA_PLATFORM: offscreen
          GSETTINGS_BACKEND: memory
        run: ctest --test-dir build-ci --output-on-failure --timeout 180 -j2

      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-source-tests-${{ github.run_id }}
          path: |
            build-ci/Testing/Temporary/LastTest.log
            build-ci/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Freeze exact epoch3 network and updater helpers
        run: |
          .ci-python/Scripts/python.exe -m pip install --disable-pip-version-check -r tools/requirements-engine-host.txt
          .ci-python/Scripts/python.exe tools/build_horizon_engine_host.py --output frozen-host
          pgn_site="$(.ci-python/Scripts/python.exe -c 'import sysconfig;print(sysconfig.get_paths()["purelib"])')"
          .ci-python/Scripts/python.exe tools/build_horizon_updater.py --output frozen-updater --dependencies "$pgn_site"
      - name: Collect the actual Qt binary and plugin dependency closure
        run: |
          mkdir -p app-stage/ui/plugins/platforms app-stage/ui/plugins/sqldrivers app-stage/ui/plugins/tls app-stage/ui/plugins/imageformats
          cp build-ci/PGN-Horizon.exe app-stage/ui/
          cp /ucrt64/share/qt6/plugins/platforms/qwindows.dll app-stage/ui/plugins/platforms/
          cp /ucrt64/share/qt6/plugins/sqldrivers/qsqlite.dll app-stage/ui/plugins/sqldrivers/
          for pgn_plugin in /ucrt64/share/qt6/plugins/tls/*.dll /ucrt64/share/qt6/plugins/imageformats/*.dll; do
            test -f "$pgn_plugin" || continue
            cp "$pgn_plugin" "app-stage/ui/plugins/$(basename "$(dirname "$pgn_plugin")")/"
          done
          for pgn_image in app-stage/ui/*.exe app-stage/ui/plugins/*/*.dll; do
            ldd "$pgn_image" | awk '/=> \/ucrt64\/bin\// {print $3}' | while read -r pgn_dependency; do cp "$pgn_dependency" app-stage/ui/; done
          done
          printf '[Paths]\nPlugins=plugins\n' > app-stage/ui/qt.conf
          cp -r frozen-host/dist/horizon-engine-host app-stage/host
          cp -r frozen-updater/dist/horizon-updater app-stage/updater
          cp frozen-host/ENGINE-HOST-SOURCE.json app-stage/
          cp frozen-updater/UPDATER-SOURCE.json app-stage/
          tar -czf epoch3-apps-windows.tar.gz -C app-stage .
      - name: Preserve exact qualified application inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: epoch3-apps-windows-${{ github.run_id }}
          path: epoch3-apps-windows.tar.gz
          if-no-files-found: error
          retention-days: 3
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build qt6-base-dev libqt6sql6-sqlite libgmp-dev libsqlite3-dev zlib1g-dev libboost-dev python3-venv
      - name: Install pinned updater test dependencies
        run: |
          python3 -m venv .ci-python
          .ci-python/bin/python -m pip install --disable-pip-version-check -r tools/requirements-updater.txt
      - name: Record the actual toolchain
        run: |
          g++ --version
          cmake --version
          ninja --version
          dpkg-query -W qt6-base-dev libgmp-dev libsqlite3-dev
      - name: Configure from a fresh checkout
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$PWD/.ci-python/bin/python"
      - name: Build every default target
        run: cmake --build build-ci --parallel 2
      - name: Run registered isolated tests
        env:
          QT_QPA_PLATFORM: offscreen
          GSETTINGS_BACKEND: memory
        run: ctest --test-dir build-ci --output-on-failure --timeout 180 -j2
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ubuntu-source-tests-${{ github.run_id }}
          path: |
            build-ci/Testing/Temporary/LastTest.log
            build-ci/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Freeze exact epoch3 network and updater helpers
        run: |
          .ci-python/bin/python -m pip install --disable-pip-version-check -r tools/requirements-engine-host.txt
          .ci-python/bin/python tools/build_horizon_engine_host.py --output frozen-host
          pgn_site="$(.ci-python/bin/python -c 'import sysconfig;print(sysconfig.get_paths()["purelib"])')"
          .ci-python/bin/python tools/build_horizon_updater.py --output frozen-updater --dependencies "$pgn_site"
      - name: Collect the actual Qt binary and frozen helper outputs
        run: |
          mkdir -p app-stage/ui
          cp build-ci/PGN-Horizon app-stage/ui/
          ldd build-ci/PGN-Horizon > app-stage/ui/dependencies.txt
          cp -r frozen-host/dist/horizon-engine-host app-stage/host
          cp -r frozen-updater/dist/horizon-updater app-stage/updater
          cp frozen-host/ENGINE-HOST-SOURCE.json app-stage/
          cp frozen-updater/UPDATER-SOURCE.json app-stage/
          tar -czf epoch3-apps-ubuntu.tar.gz -C app-stage .
      - name: Preserve exact qualified application inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: epoch3-apps-ubuntu-${{ github.run_id }}
          path: epoch3-apps-ubuntu.tar.gz
          if-no-files-found: error
          retention-days: 3
