name: Integrated Linux UI and updater qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the established Qt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build qt6-base-dev libqt6sql6-sqlite libgmp-dev libsqlite3-dev zlib1g-dev libboost-dev python3-venv
          python3 -m venv .ci-python
          .ci-python/bin/python -m pip install --disable-pip-version-check -r tools/requirements-updater.txt -r tools/requirements-engine-host.txt
      - name: Build the actual integrated application and selector
        run: |
          cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$PWD/.ci-python/bin/python"
          cmake --build build-ci --parallel 2 --target PGN-Horizon pgn-update-selector-test pgn-network-mining-core-summary-test pgn-network-work-view-test pgn-audit-explorer-view-test
          build-ci/pgn-update-selector-test
          QT_QPA_PLATFORM=offscreen ctest --test-dir build-ci --output-on-failure --timeout 45 -R '^(network-mining-core-summary|network-work-view|audit-explorer-view)$'
          .ci-python/bin/python -m unittest discover -s tests -p test_running_update_base.py
      - name: Freeze the actual corrected updater
        run: |
          pgn_site="$(.ci-python/bin/python -c 'import sysconfig;print(sysconfig.get_paths()["purelib"])')"
          .ci-python/bin/python tools/build_horizon_updater.py --output frozen-updater --dependencies "$pgn_site"
          mkdir -p app-stage/ui
          cp build-ci/PGN-Horizon app-stage/ui/
          ldd build-ci/PGN-Horizon > app-stage/ui/dependencies.txt
          cp -r frozen-updater/dist/horizon-updater app-stage/updater
          cp frozen-updater/UPDATER-SOURCE.json app-stage/
          tar -czf product-linux-ui.tar.gz -C app-stage .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: product-linux-ui-${{ github.run_id }}
          path: product-linux-ui.tar.gz
          if-no-files-found: error
          retention-days: 3
