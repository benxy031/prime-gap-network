name: Audit reveal batch qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check exact lifecycle and recovery invariants
        run: python tools/check_audit_batch227.py --full
      - name: Freeze the corrected resident controller
        run: |
          python -m pip install --disable-pip-version-check -r tools/requirements-engine-host.txt
          python tools/build_horizon_engine_host.py --output frozen-host
          tar -czf lifecycle-host.tar.gz -C frozen-host dist ENGINE-HOST-SOURCE.json ENGINE-HOST-SOURCE.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lifecycle-host-${{ matrix.os }}-${{ github.run_id }}
          path: lifecycle-host.tar.gz
          if-no-files-found: error
          retention-days: 3
