name: Exact epoch3 native Ubuntu RPC smoke
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fresh-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install native runtime dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libgmp10 libsqlite3-0 libevent-2.1-7t64 libevent-core-2.1-7t64 libevent-extra-2.1-7t64 libevent-pthreads-2.1-7t64
      - name: Retrieve the exact already qualified native artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,urllib.error,urllib.request,zipfile
          from pathlib import Path
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*args,**kwargs):return None
          request=urllib.request.Request('https://api.github.com/repos/wizz13150/prime-gap-network/actions/artifacts/14135871794/zip',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'PGN-epoch3-private-smoke'})
          try:response=urllib.request.build_opener(NoRedirect()).open(request,timeout=30)
          except urllib.error.HTTPError as error:
           if error.code!=302:raise RuntimeError('Artifact API HTTP '+str(error.code))from None
           response=urllib.request.urlopen(error.headers['Location'],timeout=30)
          path=Path('native.zip')
          with response,path.open('xb')as output:
           for raw in iter(lambda:response.read(1048576),b''):output.write(raw)
          assert hashlib.sha256(path.read_bytes()).hexdigest()=='0ef60e59f1099a4efdb67125ebfd10ab8b306dd7af5bc0a664c6793ff250d573'
          with zipfile.ZipFile(path)as z:
           for e in z.infolist():
            name=Path(e.filename);assert not name.is_absolute()and'..'not in name.parts
            if e.is_dir():continue
            file=Path('native')/name;file.parent.mkdir(parents=True,exist_ok=True);file.write_bytes(z.read(e))
          Path('native/pgn-core').chmod(0o755)
          PY
      - name: Bootstrap, allocate, synchronize and cold-recover the fresh native chain
        run: |
          ldd native/pgn-core
          python3 -B -I tests/native_epoch3_smoke.py --core native/pgn-core --source . --workspace "$RUNNER_TEMP/epoch3-native" --genesis 710b38654faa9f45a759ef589e818839dcc775ceebe16f7830a306ed6f8fd314
      - name: Preserve the public-only native smoke result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: epoch3-native-ubuntu-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/epoch3-native/FRESH-NATIVE-RESULT.json
          if-no-files-found: ignore
          retention-days: 3
