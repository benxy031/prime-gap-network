name: Grouped249 actual public-prefix block and wallet qualification
on:
  push:
    branches: [qualification/grouped249-actual]
permissions:
  contents: read
jobs:
  actual_grouped:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # GitHub restricts downloading a draft release asset to content writers.
    # The token is exposed only to the bounded fixture-download step below.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build libgmp-dev libsqlite3-dev libboost-dev libevent-dev pkg-config
      - name: Retrieve bounded public block fixture
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/wizz13150/prime-gap-network/releases/assets/751563538 -H 'Accept: application/octet-stream' > public-history249.blocks
          echo '09f318bfa826fad3d2af199ead9bb321dad039308864e549e3b92e6db6cfb7e4  public-history249.blocks' | sha256sum -c -
      - name: Select isolated qualification schedule only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('wallet/riecoin-core-upstream-v2606/src/pgn/audit_grouping_activation.h')
          s=p.read_text()
          old='    (void)chain;\n    // QUALIFICATION_PIN: public schedules remain absent until qualified.\n    return {};'
          new='    const auto test=*uint256::FromHex("710b38654faa9f45a759ef589e818839dcc775ceebe16f7830a306ed6f8fd314");\n    if(chain==test)return AuditGroupingActivation{test,322};\n    return {};'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
      - name: Build actual Core and settlement guards from the same ABI
        run: |
          cmake -S wallet/riecoin-core-upstream-v2606 -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DBUILD_DAEMON=ON -DENABLE_IPC=OFF -DWITH_ZMQ=OFF -DWITH_USDT=OFF -DPGN_DAEMON_OUTPUT_NAME=pgn-core-qualified249
          cmake --build build-native --parallel 2 --target riecoind pgn-native-audit-settlement-test
      - name: Actual ConnectBlock, relay, watch wallet, cold restart and reorg
        run: |
          set -euo pipefail
          mkdir -p evidence249
          build-native/bin/pgn-native-audit-settlement-test "$PWD/build-native/guard249" | tee evidence249/native-guards.jsonl
          python3 tests/native_grouped249_actual.py --core build-native/bin/pgn-core-qualified249 --history public-history249.blocks --receipt evidence249/actual.json
      - name: Preserve bounded receipts and exact qualified Core
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: grouped249-actual-${{ github.run_id }}
          path: |
            evidence249
            build-native/bin/pgn-core-qualified249
          if-no-files-found: warn

