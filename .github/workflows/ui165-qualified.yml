nt_panel.h', 'patched_sha256': '94537066a6e3bc080d72af5be86a633f2b3966b9798d3c13008c2d8c32160ee4'}, {'path': 'src/wallet/core_runtime.cpp', 'patched_sha256': 'df60193d7f64be453ff37f72c2f10de845af83f64ac5f5e7c7212648a60e0172'}, {'path': 'src/wallet/core_runtime.h', 'patched_sha256': '50622db8e5f38424aeef4679f30a2e05980dd2674b0a2d90adb094ddc01899cb'}, {'path': 'src/wallet/core_social_display.cpp', 'patched_sha256': '1cbd08e40fc7915d22bcc2c23601e5c2931376c40478962d71f9890c61e3d261'}, {'path': 'tests/audit_explorer_view_test.cpp', 'patched_sha256': '98fe7b27b32028fdb842826b29028590dc2b3d15a40014383f585c0093054b20'}, {'path': 'tests/collect_core25_runtime.py', 'patched_sha256': 'aac66b9adc9dfb4bc03c1c89ee91172435b802e74587f46c6fbfe2fd923f6e86'}, {'path': 'tests/fixtures/social_display_core23.json', 'patched_sha256': '14afc3d4d5298101feba34949e81d0401a8ad198158a024aedd7b569818c5e07'}, {'path': 'tests/network_metrics_view_test.cpp', 'patched_sha256': 'f492708e8435dac3ec99106de8f20ce706e7d09c1c767a8189e1fec0af08e422'}, {'path': 'tests/network_mining_core_summary_test.cpp', 'patched_sha256': '90bb3565e27f52d491a796b20ec313198f15bf4732c8dd345581b8045e4747c2'}, {'path': 'tests/network_work_view_test.cpp', 'patched_sha256': 'a4bc72a9439b4e7813ece392bc400e4b13c6162824b73787cb16dc68b1f2f224'}, {'path': 'tests/remote_name_request275.cpp', 'patched_sha256': '05b47343ded7013108bce4bf783f846b07592666fbb48958fbd712476a4c1d88'}, {'path': 'tests/scientific_coverage_presentation_test.cpp', 'patched_sha256': 'dadc11caa2b847e8438e6b025da1e0293fa8f624201122c2f4d9e79a92665b4f'}, {'path': 'tests/social_available_height_test.cpp', 'patched_sha256': '043d711c163953c60ce3454ce1afce445617515bb68d422174f5d6695a38628f'}, {'path': 'tests/social_display_contract_test.cpp', 'patched_sha256': '8e3884ea489a120f97df7a1acaa60414284e3b13ef5c2b784741715e7f075cf8'}, {'path': 'tests/social_display_opening_test.cpp', 'patched_sha256': '0017cbe58b63c193836e1f8f5e69276591d2f095cf24bfaca87057a69a0bcccc'}, {'path'