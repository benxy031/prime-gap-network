          git=shutil.which('git') or 'C:/Program Files/Git/bin/git.exe'
          assert subprocess.check_output([git,'rev-parse','HEAD'],text=True).strip()==expected['source']
          for row in expected['verified_files']:
              assert hashlib.sha256(Path(row['path']).read_bytes()).hexdigest()==row['patched_sha256'],row['path']
          sdk=Path(os.environ['PGN_UI_SDK'])
          for tool in ['g++.exe','ninja.exe','objdump.exe','windeployqt.exe']:
              assert (sdk/'bin'/tool).is_file(),tool
          qmake=next(p for p in [sdk/'bin/qmake6.exe',sdk/'bin/qmake.exe']if p.is_file())
          assert subprocess.check_output([str(qmake),'-query','QT_VERSION'],text=True).startswith('6.')
          print(json.dumps(dict(preflight=True,product=expected['source'],files=len(expected['verified_files']))))
          PGN_PREFLIGHT
      - name: Configure a clean Release tree
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$PWD/.ci-python/Scripts/python.exe"

      - name: Build application and affected wallet and Social targets
        id: ui_build
        run: |
          pgn_build_jobs="$(nproc)"
          if [ "$pgn_build_jobs" -gt 4 ]; then pgn_build_jobs=4; fi
          printf 'Build workers: %s\n' "$pgn_build_jobs"
