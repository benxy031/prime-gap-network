          plugin_root=Path('/usr/lib/x86_64-linux-gnu/qt6/plugins')
          for group,names in [('platforms',['libqxcb.so']),('sqldrivers',['libqsqlite.so'])]:
              for name in names:
                  target=STAGE/'plugins'/group/name;target.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(plugin_root/group/name,target)
          (STAGE/'lib').mkdir();imports={};seen=set();origins={};system={}
