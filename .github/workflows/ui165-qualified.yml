name: Social278 private access candidate
on:
  workflow_dispatch:
  push:
    branches: [qualification/social278-access]
permissions:
  contents: read
concurrency:
  group: social278-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    name: UCRT64 all targets and isolated tests
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Enable long source paths on the disposable runner
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Bootstrap MSYS2 without the failing geo-mirror update
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: false

      - name: Select the official primary package server
        run: |
          printf '%s\n' 'Server = https://repo.msys2.org/mingw/$repo/' > /etc/pacman.d/mirrorlist.mingw
          printf '%s\n' 'Server = https://repo.msys2.org/msys/$arch/' > /etc/pacman.d/mirrorlist.msys

      - name: Apply the full base update and recognize its documented terminal restart
        shell: pwsh
        run: |
          $pgnUpdateOutput = & msys2 -c 'pacman --noconfirm -Syuu' 2>&1
          $pgnUpdateExit = $LASTEXITCODE
          $pgnUpdateOutput | Out-Host
          $pgnUpdateText = $pgnUpdateOutput -join "`n"
          $pgnExpectedRestart = $pgnUpdateText.Contains('To complete this update all MSYS2 processes including this terminal will be closed.')
          if ($pgnUpdateExit -ne 0 -and -not ($pgnUpdateExit -eq 1 -and $pgnExpectedRestart)) {
            throw "MSYS2 base update failed with exit $pgnUpdateExit"
          }
          exit 0

      - name: Finish the full system update in a fresh MSYS2 session
        run: pacman --noconfirm -Syu

      - name: Install the authenticated UCRT64 build dependencies
        run: |
          pacman --noconfirm --needed -S \
            mingw-w64-ucrt-x86_64-gcc \
            mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-ninja \
            mingw-w64-ucrt-x86_64-qt6-base \
            mingw-w64-ucrt-x86_64-gmp \
            mingw-w64-ucrt-x86_64-sqlite3 \
            mingw-w64-ucrt-x86_64-zlib \
            mingw-w64-ucrt-x86_64-boost

      - name: Record the actual tool versions
        run: |
          g++ --version
          cmake --version
          ninja --version
          pacman -Q mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-sqlite3 mingw-w64-ucrt-x86_64-gmp


      - name: Compile actual Social source and Native-wire QA client
        run: |
          cmake -S qualification/social278-qt -B build-social278 -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-social278 --parallel 4
      - name: Existing Social regression checks
        run: |
          export QT_PLUGIN_PATH="$(qmake6 -query QT_INSTALL_PLUGINS)"
          ctest --test-dir build-social278 --output-on-failure
      - name: Access policy, protocol, storage and backpressure tests
        shell: pwsh
        working-directory: qualification/social278-access
        run: |
          python -m unittest test_authority test_backend test_http test_registry -v
          if ($LASTEXITCODE -ne 0) { throw "Access candidate tests failed" }
      - name: Collect only QA executables and exact SDK receipt
        run: |
          mkdir -p social278-qa
          cp build-social278/qt_roles_test.exe build-social278/social_view_test.exe social278-qa/
          qmake6 -query QT_VERSION > social278-qa/QT_VERSION.txt
          g++ -dumpversion > social278-qa/GCC_VERSION.txt
          git rev-parse HEAD > social278-qa/SOURCE.txt
          sha256sum social278-qa/*.exe > social278-qa/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: social278-qa-windows
          path: social278-qa
          if-no-files-found: error
