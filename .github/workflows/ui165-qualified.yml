      - name: Run registered isolated tests
        id: ui_tests
        env:
          QT_QPA_PLATFORM: offscreen
          GSETTINGS_BACKEND: memory
        run: |
          ctest --test-dir build-ci --output-on-failure --timeout 180 -j2 -R "^(social-view|wallet-management|network-work-view|audit-explorer-view|social-rosette-counts|scientific-coverage-presentation|social-display-contract|social-available-height|social-display-opening|social-name-confirmation|social-remote-name-signer|network-metrics-view|network-metrics-snapshot|network-mining-core-summary)$"
          QT_QPA_PLATFORM=offscreen build-ci/pgn-wallet-fresh-setup-view-test
      - name: Check audit lifecycle and grouped publication regressions
        if: ${{ !cancelled() && steps.ui_build.outcome == 'success' }}
        run: |
          .ci-python/bin/python -I tests/test_late_cycle_completion.py
          .ci-python/bin/python -I tests/test_audit_reveal_batch.py
          .ci-python/bin/python -I tests/test_shared_audit_reveals.py
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ubuntu-source-tests-${{ github.run_id }}
          path: |
            build-ci/Testing/Temporary/LastTest.log
            build-ci/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Finalize candidate with actual full-suite status
        id: ui_finalize
        if: ${{ !cancelled() && steps.ui_collect.outcome == 'success' }}
        env:
          PGN_CTEST_OUTCOME: ${{ steps.ui_tests.outcome }}
        run: |
          .ci-python/bin/python - <<'PGN_FINALIZE'
          from pathlib import Path
          import json,os,tarfile
          p=Path('LINUX-UI-BUILD.json')
          v=json.loads(p.read_text());v['qualification']['ctest_outcome']=os.environ['PGN_CTEST_OUTCOME'];v['qualification']['affected_suite_pass']=os.environ['PGN_CTEST_OUTCOME']=='success'
          p.write_text(json.dumps(v,indent=2)+'\n',encoding='utf-8')
          with tarfile.open('ui165-ubuntu.tar.gz','w:gz')as a:
              a.add('ui-stage',arcname='ui');a.add(p,arcname=p.name)
          print(json.dumps(v['qualification']))
          PGN_FINALIZE
      - name: Preserve candidate UI-only runtime and qualification status
        if: ${{ !cancelled() && steps.ui_finalize.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ui165-ubuntu-${{ github.run_id }}
          path: ui165-ubuntu.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
