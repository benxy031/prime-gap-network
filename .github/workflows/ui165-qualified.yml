      - name: Run the isolated registered tests
        id: ui_tests
        env:
          QT_QPA_PLATFORM: offscreen
          GSETTINGS_BACKEND: memory
        run: |
          ctest --test-dir build-ci --output-on-failure --timeout 180 -j2 -R "^(social-view|wallet-management|network-work-view|audit-explorer-view|social-rosette-counts|scientific-coverage-presentation|social-display-contract|social-available-height|social-display-opening|social-name-confirmation|social-remote-name-signer|network-metrics-view|network-metrics-snapshot|network-mining-core-summary)$"
          QT_QPA_PLATFORM=offscreen build-ci/pgn-wallet-fresh-setup-view-test

      - name: Check audit lifecycle and grouped publication regressions
        if: ${{ !cancelled() && steps.ui_build.outcome == 'success' }}
        run: |
          .ci-python/Scripts/python.exe -I tests/test_late_cycle_completion.py
          .ci-python/Scripts/python.exe -I tests/test_audit_reveal_batch.py
          .ci-python/Scripts/python.exe -I tests/test_shared_audit_reveals.py
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-source-tests-${{ github.run_id }}
