          print(json.dumps(v['qualification']))
          PGN_FINALIZE
      - name: Preserve candidate UI-only runtime and qualification status
        if: ${{ !cancelled() && steps.ui_finalize.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ui165-windows-${{ github.run_id }}
          path: ui165-windows.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
