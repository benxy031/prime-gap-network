name: Reproduce slow owned Core handoff and verify disposable low-space fixture
on:
  push:
    branches: [qualification/horizon-old-core-preflight]
permissions:
  contents: read
  actions: read
jobs:
  fixture:
    runs-on: windows-latest
    timeout-minutes: 14
    steps:
      - name: Enable long source paths for the disposable fixture
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            src/update
            tests
            qualification/core-handoff
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned updater fixture dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-updater.txt
      - uses: actions/download-artifact@v4
        with:
          name: horizon-core-handoff-windows
          path: handoff-compiled
          run-id: 44194148621
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify one isolated Windows volume and both Core handoff outcomes
        run: python -X utf8 qualification/core-handoff/preflight_old_core.py handoff-compiled/PGN-Horizon.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: core-handoff-platform-preflight
          path: handoff-preflight/evidence
          if-no-files-found: warn
          retention-days: 7
