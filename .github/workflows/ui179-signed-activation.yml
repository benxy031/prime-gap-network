name: UI179 exact signed Windows activation
on:
  push:
    branches: [qualification/ui179-signed-activation-47]
permissions:
  contents: read
jobs:
  windows:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - name: Allow long test source paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /src/update/
            /tests/native_grouped249_actual.py
            /qualification/ui177/legacy-chain.zip
      - name: Fetch the exact candidate from the unpublished draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download qa-ui179-win47 --repo $env:GITHUB_REPOSITORY --dir signed-candidate-47
          if ($LASTEXITCODE -ne 0) { throw 'Qualification draft assets unavailable' }
      - name: Prepare pinned verification dependencies
        shell: pwsh
        run: |
          python -m venv .qa-updater
          if ($LASTEXITCODE -ne 0) { throw 'Updater venv failed' }
          & .qa-updater/Scripts/python.exe -m pip install --disable-pip-version-check -r tools/requirements-updater.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned updater dependencies failed' }
      - name: Activate the signed cohort with the actual Windows lifecycle
        shell: pwsh
        run: |
          & .qa-updater/Scripts/python.exe tools/qualify_ui179_signed_activation.py
          if ($LASTEXITCODE -ne 0) { throw 'Signed Windows activation failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ui179-signed-activation-${{ github.run_id }}
          path: ui179-signed-windows/evidence/
          if-no-files-found: warn
          retention-days: 7
