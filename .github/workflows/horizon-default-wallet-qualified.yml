name: Verify portable Horizon opens an existing default wallet
on:
  push:
    branches: [qualification/horizon-default-wallet]
permissions:
  contents: read
jobs:
  wallet_default:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /src/update/
            /tests/native_grouped249_actual.py
      - name: Use the standard pinned updater and IPC dependencies
        shell: pwsh
        run: |
          python -m venv .qa-wallet
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare isolated Python' }
          & .qa-wallet/Scripts/python.exe -m pip install --disable-pip-version-check -r tools/requirements-updater.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned updater dependencies failed' }
      - name: Run the exact public package without selecting or creating a wallet in Horizon
        shell: pwsh
        run: |
          & .qa-wallet/Scripts/python.exe tools/qualify_default_wallet_windows.py
          if ($LASTEXITCODE -ne 0) { throw 'Automatic existing wallet test failed' }
      - name: Preserve synthetic test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: horizon-default-wallet-${{ github.run_id }}
          path: default-wallet-evidence/
          if-no-files-found: error
          retention-days: 7
