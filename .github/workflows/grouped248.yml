name: Grouped audit settlement248 native rebuild
on:
  push:
    branches: [qualification/grouped-audit-settlement248]
permissions:
  contents: read
jobs:
  grouped_native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build libgmp-dev libsqlite3-dev libboost-dev libevent-dev pkg-config
      - name: Configure actual native libraries
        run: cmake -S wallet/riecoin-core-upstream-v2606 -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DBUILD_BITCOIN_BIN=OFF -DENABLE_IPC=OFF -DWITH_ZMQ=OFF -DWITH_USDT=OFF
      - name: Rebuild changed ABI and production callers
        run: cmake --build build-native --parallel 2 --target pgn-native-audit-settlement-test pgn-native-epoch3-reset-test pgn-native-audit-availability-test pgn-native-audit-replay-test
      - name: Exact financial, persistent UTXO and undo checks
        run: |
          set -euo pipefail
          mkdir -p evidence248
          build-native/bin/pgn-native-audit-settlement-test "$PWD/build-native/settlement248" | tee evidence248/settlement.jsonl
          build-native/bin/pgn-native-epoch3-reset-test | tee evidence248/epoch3.jsonl
          build-native/bin/pgn-native-audit-availability-test | tee evidence248/availability.jsonl
          build-native/bin/pgn-native-audit-replay-test "$PWD/build-native/replay248" | tee evidence248/replay.jsonl
      - name: Preserve exact qualification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: grouped248-${{ github.run_id }}
          path: evidence248
          if-no-files-found: warn
