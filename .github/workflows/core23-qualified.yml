name: Core23 Social display storage portability and Native guards
on:
  push:
    branches: [qualification/product269-native]
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # GitHub restricts downloading a draft release asset to content writers.
    # The token is exposed only to the bounded fixture-download step below.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build libgmp-dev libsqlite3-dev libboost-dev libevent-dev pkg-config
      - name: Retrieve bounded public block fixture
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/wizz13150/prime-gap-network/releases/assets/751563538 -H 'Accept: application/octet-stream' > public-history249.blocks
          echo '09f318bfa826fad3d2af199ead9bb321dad039308864e549e3b92e6db6cfb7e4  public-history249.blocks' | sha256sum -c -
      - name: Build actual Core and settlement guards from the same ABI
        run: |
          cmake -S wallet/riecoin-core-upstream-v2606 -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DBUILD_DAEMON=ON -DENABLE_IPC=OFF -DWITH_ZMQ=OFF -DWITH_USDT=OFF -DPGN_DAEMON_OUTPUT_NAME=pgn-core
          jobs=$(nproc); ram_jobs=$(( $(awk '/MemAvailable/{print $2}' /proc/meminfo) / 2048000 )); ((ram_jobs < 1)) && ram_jobs=1; ((jobs > ram_jobs)) && jobs=$ram_jobs
          cmake --build build-native --parallel "$jobs" --target riecoind pgn-native-audit-settlement-test pgn-native-leaderboard-test pgn-leaderboard-rosettes-test
      - name: Qualified leaderboard and exact compact medal statistics
        run: |
          set -euo pipefail
          mkdir -p evidence23
          build-native/bin/pgn-native-leaderboard-test "$PWD/build-native/leaderboard268" | tee evidence23/leaderboard.txt
          build-native/bin/pgn-leaderboard-rosettes-test wallet/riecoin-core-upstream-v2606/src/pgn/leaderboard_rosettes_oracle.txt wallet/riecoin-core-upstream-v2606/src/pgn/leaderboard_rosettes_batch_oracle.txt | tee evidence23/rosettes.txt
      - name: Actual ConnectBlock, relay, watch wallet, cold restart and reorg
        run: |
          set -euo pipefail
          mkdir -p evidence23
          build-native/bin/pgn-native-audit-settlement-test "$PWD/build-native/guard249" | tee evidence23/native-guards.jsonl
          python3 tests/native_grouped249_actual.py --core build-native/bin/pgn-core --history public-history249.blocks --legacy --receipt evidence23/actual.json
      - name: Collect exact production Core
        if: ${{ !cancelled() }}
        run: |
          mkdir -p core23
          cp build-native/bin/pgn-core core23/pgn-core
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess
          p=Path('core23/pgn-core')
          observed=subprocess.check_output([str(p),'--version'],text=True)
          assert '2026.11.16.23' in observed,observed
          Path('evidence23/CORE-BUILD.json').write_text(json.dumps(dict(source=os.environ['GITHUB_SHA'],version='2026.11.16.23',activation=4096,files=[dict(path=p.name,bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest())]),indent=2)+'\n')
          PY
      - name: Preserve production candidate and test receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: core23-ubuntu-${{ github.run_id }}
          path: |
            core23
            evidence23
          if-no-files-found: error
          retention-days: 7
