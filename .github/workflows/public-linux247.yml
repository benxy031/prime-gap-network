name: Public Linux updater247 exact real GUI activation
on:
  push:
    branches: [qualification/public-linux-updater247]
permissions:
  contents: read
jobs:
  public_linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Existing runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qt6-base-dev libqt6sql6-sqlite libgmp10 libsqlite3-0 zlib1g xvfb xauth python3-venv
          python3 -m venv .qa-updater
          .qa-updater/bin/python -m pip install -r tools/requirements-updater.txt
      - name: Real signed public install and normal Qt restart
        run: xvfb-run -a .qa-updater/bin/python tools/qualify_public_linux247.py
      - name: Preserve bounded evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-linux247-${{ github.run_id }}
          path: |
            public-linux247/RESULT.json
            public-linux247/evidence
            public-linux247/installation/current.json
            public-linux247/installation/transaction.json
            public-linux247/installation/linux-lifecycle.json
          if-no-files-found: error
