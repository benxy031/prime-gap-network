name: Verify transparent Windows archive compression and old-reader compatibility
on:
  push:
    branches: [qualification/horizon-archive-storage]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Enable long source paths on the disposable runner
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Bootstrap MSYS2 without the failing geo-mirror update
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          path-type: inherit
          update: false

      - name: Select the official primary package server
        run: |
          printf '%s\n' 'Server = https://repo.msys2.org/mingw/$repo/' > /etc/pacman.d/mirrorlist.mingw
          printf '%s\n' 'Server = https://repo.msys2.org/msys/$arch/' > /etc/pacman.d/mirrorlist.msys

      - name: Apply the full base update and recognize its documented terminal restart
        shell: pwsh
        run: |
          $pgnUpdateOutput = & msys2 -c 'pacman --noconfirm -Syuu' 2>&1
          $pgnUpdateExit = $LASTEXITCODE
          $pgnUpdateOutput | Out-Host
          $pgnUpdateText = $pgnUpdateOutput -join "`n"
          $pgnExpectedRestart = $pgnUpdateText.Contains('To complete this update all MSYS2 processes including this terminal will be closed.')
          if ($pgnUpdateExit -ne 0 -and -not ($pgnUpdateExit -eq 1 -and $pgnExpectedRestart)) {
            throw "MSYS2 base update failed with exit $pgnUpdateExit"
          }
          exit 0

      - name: Finish the full system update in a fresh MSYS2 session
        run: pacman --noconfirm -Syu

      - name: Install the authenticated UCRT64 build dependencies
        run: |
          pacman --noconfirm --needed -S \
            mingw-w64-ucrt-x86_64-gcc \
            mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-ninja \
            mingw-w64-ucrt-x86_64-gmp \
            mingw-w64-ucrt-x86_64-sqlite3 \
            mingw-w64-ucrt-x86_64-zlib \
            mingw-w64-ucrt-x86_64-boost \
            mingw-w64-ucrt-x86_64-libevent
      - name: Retrieve bounded public and actual Core20 fixtures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/wizz13150/prime-gap-network/releases/assets/751563538 -H 'Accept: application/octet-stream' > public-history249.blocks
          gh api repos/wizz13150/prime-gap-network/releases/assets/754436598 -H 'Accept: application/octet-stream' > legacy20.zip
          python -c "import hashlib;from pathlib import Path;assert hashlib.sha256(Path('legacy20.zip').read_bytes()).hexdigest()=='33f5d5a206786715725ffbed770bfeba3b014898bf6c0e734419fbbb62a050c6';assert hashlib.sha256(Path('public-history249.blocks').read_bytes()).hexdigest()=='09f318bfa826fad3d2af199ead9bb321dad039308864e549e3b92e6db6cfb7e4'"
      - name: Verify archived released Windows Core29 for rollback read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/wizz13150/prime-gap-network/actions/artifacts/14367339423/zip > released-core29.zip
          echo '1de6240b3cded293aceae14254370f65e19af9fb6d4dba3a3bfdb58220a1fbc5  released-core29.zip' | sha256sum --check
          python -m zipfile -e released-core29.zip released-core29
      - name: Build exact production Core and native guards
        run: |
          cmake -S wallet/riecoin-core-upstream-v2606 -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DBUILD_DAEMON=ON -DENABLE_IPC=OFF -DWITH_ZMQ=OFF -DWITH_USDT=OFF -DPGN_DAEMON_OUTPUT_NAME=pgn-core
          cmake --build build-native --parallel 3 --target riecoind pgn-native-audit-settlement-test pgn-native-leaderboard-test pgn-leaderboard-rosettes-test pgn-native-range-reader-test
      - name: Collect all actual runtime dependencies
        run: |
          mkdir -p evidence29
          python tests/collect_core29_runtime.py --core build-native/bin/pgn-core.exe --out core29/Core --sdk "$(cygpath -w /ucrt64/bin)" > evidence29/BUILD.json
      - name: Read the compressed archive with the released Core reader
        run: python tests/native_archive_filesystem_actual.py --core core29/Core/pgn-core.exe --released released-core29/core29/Core/pgn-core.exe --history public-history249.blocks --receipt evidence29/ARCHIVE-FILESYSTEM.json
      - name: Actual Core20 cache normal migration and cold restart with clean runtime PATH
        run: python tests/native_core25_migration_actual.py --core core29/Core/pgn-core.exe --fixture legacy20.zip --work build-native/legacy25 --receipt evidence29/MIGRATION.json
      - name: Actual empty-cache authority transition over authenticated public history
        run: python tests/native_authority_cache_actual.py --core core29/Core/pgn-core.exe --history public-history249.blocks --receipt evidence29/AUTHORITY-CACHE.json
      - name: Legacy migration with optional database checks disabled
        run: python tests/native_core25_migration_actual.py --core core29/Core/pgn-core.exe --fixture legacy20.zip --work build-native/legacy28-no-checks --receipt evidence29/MIGRATION-OPTIONAL-OFF.json --optional-check-level 0
      - name: Actual calendar statistics and largest recorded gap RPC
        run: python tests/native_statistics_actual.py --core core29/Core/pgn-core.exe --history public-history249.blocks --receipt evidence29/STATISTICS.json
      - name: Native monetary, replay, wallet and statistics regressions
        run: |
          build-native/bin/pgn-native-range-reader-test.exe "$PWD/build-native/report-registry" > evidence29/report-registry.txt
          build-native/bin/pgn-native-audit-settlement-test.exe "$PWD/build-native/guard25" > evidence29/native-guards.jsonl
          build-native/bin/pgn-native-leaderboard-test.exe "$PWD/build-native/leaderboard25" > evidence29/leaderboard.txt
          build-native/bin/pgn-leaderboard-rosettes-test.exe wallet/riecoin-core-upstream-v2606/src/pgn/leaderboard_rosettes_oracle.txt wallet/riecoin-core-upstream-v2606/src/pgn/leaderboard_rosettes_batch_oracle.txt > evidence29/rosettes.txt
          python tests/native_grouped249_actual.py --core core29/Core/pgn-core.exe --history public-history249.blocks --legacy --receipt evidence29/ACTUAL.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: horizon-archive-storage-${{ github.run_id }}
          path: |
            core29
            evidence29
            build-native/legacy25/*.stdout
            build-native/legacy25/*.stderr
            build-native/legacy25/testnet/debug.log
          if-no-files-found: error
          retention-days: 7
