name: Measure exact leaderboard cache on Windows
on:
  push:
    branches: [qualification/horizon-leaderboard-windows]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Enable long source paths on the disposable runner
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Bootstrap MSYS2 without the failing geo-mirror update
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          path-type: inherit
          update: false

      - name: Select the official primary package server
        run: |
          printf '%s\n' 'Server = https://repo.msys2.org/mingw/$repo/' > /etc/pacman.d/mirrorlist.mingw
          printf '%s\n' 'Server = https://repo.msys2.org/msys/$arch/' > /etc/pacman.d/mirrorlist.msys

      - name: Apply the full base update and recognize its documented terminal restart
        shell: pwsh
        run: |
          $pgnUpdateOutput = & msys2 -c 'pacman --noconfirm -Syuu' 2>&1
          $pgnUpdateExit = $LASTEXITCODE
          $pgnUpdateOutput | Out-Host
          $pgnUpdateText = $pgnUpdateOutput -join "`n"
          $pgnExpectedRestart = $pgnUpdateText.Contains('To complete this update all MSYS2 processes including this terminal will be closed.')
          if ($pgnUpdateExit -ne 0 -and -not ($pgnUpdateExit -eq 1 -and $pgnExpectedRestart)) {
            throw "MSYS2 base update failed with exit $pgnUpdateExit"
          }
          exit 0

      - name: Finish the full system update in a fresh MSYS2 session
        run: pacman --noconfirm -Syu

      - name: Install the authenticated UCRT64 build dependencies
        run: |
          pacman --noconfirm --needed -S \
            mingw-w64-ucrt-x86_64-gcc \
            mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-ninja \
            mingw-w64-ucrt-x86_64-gmp \
            mingw-w64-ucrt-x86_64-sqlite3 \
            mingw-w64-ucrt-x86_64-zlib \
            mingw-w64-ucrt-x86_64-boost \
            mingw-w64-ucrt-x86_64-libevent
      - name: Acquire the exact published Windows Core29 and verified history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/wizz13150/prime-gap-network/actions/artifacts/14367339423/zip > core29-windows.zip
          gh api repos/wizz13150/prime-gap-network/releases/assets/751563538 -H 'Accept: application/octet-stream' > public-history249.blocks
          echo '09f318bfa826fad3d2af199ead9bb321dad039308864e549e3b92e6db6cfb7e4  public-history249.blocks' | sha256sum --check
          python -c "import pathlib,zipfile; p=pathlib.Path('reference').resolve(); z=zipfile.ZipFile('core29-windows.zip'); ns=[n for n in z.namelist() if n.startswith('core29/Core/')]; assert any(n.endswith('/pgn-core.exe') for n in ns) and all((p/n).resolve().is_relative_to(p) for n in ns); z.extractall(p, ns)"
          echo '6e0d827229ab23fc36f0957f53e43548f6f05437d826b15e5ed98ea0825335ce  reference/core29/Core/pgn-core.exe' | sha256sum --check
      - name: Build the exact candidate and test merit threshold boundaries
        run: |
          cmake -S wallet/riecoin-core-upstream-v2606 -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DBUILD_DAEMON=ON -DENABLE_IPC=OFF -DWITH_ZMQ=OFF -DWITH_USDT=OFF -DPGN_DAEMON_OUTPUT_NAME=pgn-core
          cmake --build build-native --target riecoind pgn-leaderboard-rosettes-test --parallel 4
          build-native/bin/pgn-leaderboard-rosettes-test.exe wallet/riecoin-core-upstream-v2606/src/pgn/leaderboard_rosettes_oracle.txt wallet/riecoin-core-upstream-v2606/src/pgn/leaderboard_rosettes_batch_oracle.txt
      - name: Compare four real Windows replays and exact cold results
        run: python tests/native_leaderboard_log_cache_ab.py --baseline reference/core29/Core/pgn-core.exe --candidate build-native/bin/pgn-core.exe --history public-history249.blocks --receipt evidence/RESULT.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success()
        with:
          name: horizon-leaderboard-windows-measurements
          path: evidence/RESULT.json
          if-no-files-found: error
          retention-days: 7
