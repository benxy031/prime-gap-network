name: Ticket archive catalog qualification
on:
  push:
    branches: [qualification/ticket-catalog317]
permissions:
  contents: read
jobs:
  archive:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify ticket cursor and archive callbacks with canonical paths
        run: >-
          python -B tests/test_ticket_archive_batches.py
          ArchiveBatchTests.test_wrap_revisits_active_and_new_lower_ids
          ArchiveBatchTests.test_compaction_returns_only_exact_shared_owner_hints
      - name: Verify background archive recovery and nonblocking return
        run: >-
          python -B tests/test_archive_lane.py
          ArchiveLaneTests.test_real_archive_bytes_and_recovery_are_preserved_off_lane
          ArchiveLaneTests.test_blocked_cleanup_does_not_block_result_return
