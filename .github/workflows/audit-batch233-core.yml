name: Private audit batch Core20 components
on:
  workflow_dispatch:
    inputs:
      build_linux:
        description: Rebuild Linux only when its already-qualified Core inputs change
        type: boolean
        default: false
  push:
    branches: [qualification/audit-batch233-public]
    paths:
      - wallet/riecoin-core-upstream-v2606/**
      - tools/collect_audit_batch233_core.py
      - tools/collect_audit_batch233_sdk.py
      - .github/workflows/audit-batch233-core.yml
permissions:
  contents: read
jobs:
  core-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.build_linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Native compiler dependencies on disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build libgmp-dev libsqlite3-dev libboost-dev libevent-dev pkg-config
      - name: Build Core20 and existing native audit verifier
        run: |
          cmake -S wallet/riecoin-core-upstream-v2606 -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DBUILD_BITCOIN_BIN=OFF -DENABLE_IPC=OFF -DWITH_ZMQ=OFF -DWITH_USDT=OFF '-DCMAKE_BUILD_RPATH=$ORIGIN'
          cmake --build build-native --parallel 2 --target riecoind pgn-native-audit-replay-test
          build-native/bin/pgn-native-audit-replay-test "$PWD/build-native/audit-fixture"
      - name: Collect Core and exact immutable source evidence
        run: python3 -B tools/collect_audit_batch233_core.py
      - uses: actions/upload-artifact@v4
        with:
          name: audit-batch233-core-ubuntu
          path: core233
          if-no-files-found: error
          retention-days: 7
  core-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Preserve source bytes and long paths
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve and verify native Git before any build
        id: native_git
        shell: pwsh
        run: |
          $qaGit = (Get-Command git.exe -ErrorAction Stop).Source
          & $qaGit --version
          "git_path=$qaGit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-libevent
      - name: Build Core20 product first
        id: core_build
        run: |
          cmake -S wallet/riecoin-core-upstream-v2606 -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DBUILD_BITCOIN_BIN=OFF -DENABLE_IPC=OFF -DWITH_ZMQ=OFF -DWITH_USDT=OFF
          cmake --build build-native --parallel 2 --target riecoind
      - name: Export product Core DLLs and blocking source checks independently
        env:
          PYTHON_EXPLICIT: ${{ steps.python.outputs.python-path }}
          GIT_EXPLICIT: ${{ steps.native_git.outputs.git_path }}
        run: |
          qa_python="$(cygpath -u "$PYTHON_EXPLICIT")"
          qa_tools="$(cygpath -w "$MINGW_PREFIX/bin")"
          "$qa_python" -B tools/collect_audit_batch233_core.py --tool-bin "$qa_tools" --git "$GIT_EXPLICIT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-batch233-core-windows
          path: core233
          if-no-files-found: error
          retention-days: 7
      - name: Optional private SDK after product export
        id: sdk
        continue-on-error: true
        if: steps.core_build.outcome == 'success'
        env:
          PYTHON_EXPLICIT: ${{ steps.python.outputs.python-path }}
          GIT_EXPLICIT: ${{ steps.native_git.outputs.git_path }}
        run: |
          cmake --build build-native --parallel 2 --target pgn-native-audit-replay-test
          build-native/bin/pgn-native-audit-replay-test.exe "$PWD/build-native/audit-fixture"
          qa_python="$(cygpath -u "$PYTHON_EXPLICIT")"
          qa_ninja="$(cygpath -w "$MINGW_PREFIX/bin/ninja.exe")"
          "$qa_python" -B tools/collect_audit_batch233_sdk.py --ninja "$qa_ninja" --git "$GIT_EXPLICIT"
      - name: Record optional SDK outcome separately
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native-sdk | Out-Null
          '{"optional_sdk_outcome":"${{ steps.sdk.outcome }}","product_checks_remain_blocking":true}' | Set-Content -Encoding utf8 native-sdk/NATIVE-SDK-STATUS.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-sdk233-windows
          path: native-sdk
          if-no-files-found: error
          retention-days: 7
