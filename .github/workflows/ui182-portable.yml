name: UI182 standard Windows download and native synchronization
on:
  push:
    branches: [qualification/ui182-portable-50]
permissions:
  contents: read
jobs:
  windows:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - name: Allow long test source paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /src/update/
            /tests/native_grouped249_actual.py
            /qualification/ui177/legacy-chain.zip
            /qualification/ui182-portable/
      - name: Fetch the exact candidate from the unpublished draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download qa-ui182-win50 --repo $env:GITHUB_REPOSITORY --dir signed-candidate-50 --pattern "*.components-50.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Qualification draft assets unavailable' }
      - name: Prepare pinned verification dependencies
        shell: pwsh
        run: |
          python -m venv .qa-updater
          if ($LASTEXITCODE -ne 0) { throw 'Updater venv failed' }
          & .qa-updater/Scripts/python.exe -m pip install --disable-pip-version-check -r tools/requirements-updater.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned updater dependencies failed' }
      - name: Assemble the exact signed files into the standard download
        shell: pwsh
        run: |
          $bundle = @(Get-ChildItem -LiteralPath signed-candidate-50 -Filter '*.components-50.zip')
          if ($bundle.Count -ne 1) { throw 'Expected one exact Windows bundle' }
          & .qa-updater/Scripts/python.exe tools/assemble_ui182_portable.py $bundle[0].FullName qualification/ui182-portable/components.json portable-ui182/PGN-Windows-182.zip
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }
      - name: Open the exact short-name Windows package and resume sync
        shell: pwsh
        run: |
          & .qa-updater/Scripts/python.exe tools/qualify_ui182_portable.py
          if ($LASTEXITCODE -ne 0) { throw 'Standalone package qualification failed' }
      - name: Check Defender using a text control and exact candidate files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = (Get-Content -LiteralPath 'portable-ui182/BUILD.json' -Raw | ConvertFrom-Json).sha256
          $zip = Get-Item -LiteralPath "portable-ui182/PGN-Windows-182.zip"
          if ((Get-FileHash -LiteralPath $zip.FullName).Hash.ToLowerInvariant() -ne $expected) { throw 'Signed target digest mismatch' }
          $destination = (New-Item -ItemType Directory -Path scan-proof,scan-fixture/files)[1].FullName
          $arc = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            foreach ($path in @('PGN/PGN-Horizon.exe','PGN/EngineRuntime/network/horizon-engine-host.exe')) {
              $entry = $arc.GetEntry($path)
              if (!$entry) { throw 'Unexpected archive inventory' }
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entry,(Join-Path $destination $entry.Name),$false)
            }
          } finally { $arc.Dispose() }
          $defender = Join-Path $env:ProgramData 'Microsoft/Windows Defender/Platform'
          $command = Get-ChildItem -LiteralPath $defender -Directory | Where-Object {$_.Name -match '^[0-9]+\.'} |
            Sort-Object LastWriteTime -Descending | ForEach-Object {Join-Path $_.FullName 'MpCmdRun.exe'} |
            Where-Object {Test-Path -LiteralPath $_} | Select-Object -First 1
          $control = Join-Path $destination 'control.txt'
          Set-Content -LiteralPath $control 'PGN Horizon QA text control'
          $results = @()
          if ($command) {
            foreach ($path in @($control,(Join-Path $destination 'PGN-Horizon.exe'),(Join-Path $destination 'horizon-engine-host.exe'),$zip.FullName)) {
              $name = [IO.Path]::GetFileName($path)
              $log = "scan-proof/$name.log"
              & $command -Scan -ScanType 3 -File $path -DisableRemediation *> $log
              $code = $LASTEXITCODE
              $results += @{name=$name;exit_code=$code;sha256=(Get-FileHash -LiteralPath $path).Hash.ToLowerInvariant()}
              if ($code -ne 0) { break }
            }
          }
          $pass = $results.Count -eq 4 -and @($results | Where-Object {$_.exit_code -ne 0}).Count -eq 0
          @{PASS=$pass;scanner_available=[bool]$command;files=$results} |
            ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 scan-proof/result.json
          if (!$pass) { throw 'Exact Windows Defender qualification could not be completed' }
      - name: Attach the verified download to the same private draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $id = 450495413
          $repo = $env:GITHUB_REPOSITORY
          $build = Get-Content -LiteralPath 'portable-ui182/BUILD.json' -Raw | ConvertFrom-Json
          $release = gh api "repos/$repo/releases/$id" | ConvertFrom-Json
          if (!$release.draft -or $release.tag_name -ne 'qa-ui182-win50') { throw 'Only the matching private draft may be changed' }
          $asset = $release.assets | Where-Object name -eq $build.archive
          if (!$asset) {
            gh release upload qa-ui182-win50 "portable-ui182/$($build.archive)" --repo $repo
            if ($LASTEXITCODE -ne 0) { throw 'Private attachment failed' }
          }
          $release = gh api "repos/$repo/releases/$id" | ConvertFrom-Json
          $asset = $release.assets | Where-Object name -eq $build.archive
          if (!$release.draft -or $asset.state -ne 'uploaded' -or $asset.digest -ne "sha256:$($build.sha256)" -or $asset.size -ne $build.bytes) {
            throw 'Private portable digest differs'
          }
          @{PASS=$true;draft=$release.draft;id=$release.id;asset=$asset.id;digest=$asset.digest;size=$asset.size} |
            ConvertTo-Json -Compress | Set-Content -LiteralPath 'portable-ui182/DRAFT-PASS.json'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ui182-portable-${{ github.run_id }}
          path: |
            ui182-portable-windows/evidence/
            scan-proof/
            portable-ui182/BUILD.json
            portable-ui182/DRAFT-PASS.json
          if-no-files-found: warn
          retention-days: 7
